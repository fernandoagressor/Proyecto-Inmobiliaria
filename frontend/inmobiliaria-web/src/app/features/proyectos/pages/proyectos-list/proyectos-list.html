<div class="proyectos-container">

  <app-page-header
    titulo="Proyectos"
    textoBoton="Nuevo Proyecto"
    icono="add_business"
    (accion)="abrirFormulario()">
  </app-page-header>

  <div class="proyectos-container">

    <app-page-header
      titulo="Proyectos"
      textoBoton="Nuevo Proyecto"
      icono="add_business"
      (accion)="abrirFormulario()">
    </app-page-header>

    <app-project-table
      [proyectos]="proyectos"
      [columnasMostradas]="columnasMostradas"
      (editar)="editarProyecto($event)"
      (eliminar)="eliminarProyecto($event)">
    </app-project-table>

  </div>

</div>
