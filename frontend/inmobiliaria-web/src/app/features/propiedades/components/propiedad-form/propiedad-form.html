<h2 mat-dialog-title>
  {{ modoEdicion ? 'Editar Propiedad' : 'Nueva Propiedad' }}
</h2>

<mat-dialog-content>

  <form
    [formGroup]="formulario"
    class="formulario">

    <mat-form-field appearance="outline">

      <mat-label>Código</mat-label>

      <input
        matInput
        formControlName="codigo">

      <mat-error
        *ngIf="formulario.get('codigo')?.hasError('required')">

        El código es obligatorio.

      </mat-error>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Título</mat-label>

      <input
        matInput
        formControlName="titulo">

      <mat-error
        *ngIf="formulario.get('titulo')?.hasError('required')">

        El título es obligatorio.

      </mat-error>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Descripción</mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="descripcion">
      </textarea>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Dirección</mat-label>

      <input
        matInput
        formControlName="direccion">

      <mat-error
        *ngIf="formulario.get('direccion')?.hasError('required')">

        La dirección es obligatoria.

      </mat-error>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Valor</mat-label>

      <input
        matInput
        type="number"
        formControlName="valor">

      <mat-error
        *ngIf="formulario.get('valor')?.hasError('required')">

        El valor es obligatorio.

      </mat-error>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Estado</mat-label>

      <mat-select
        formControlName="estado">

        <mat-option value="DISPONIBLE">
          DISPONIBLE
        </mat-option>

        <mat-option value="VENDIDA">
          VENDIDA
        </mat-option>

        <mat-option value="RESERVADA">
          RESERVADA
        </mat-option>

      </mat-select>

      <mat-error
        *ngIf="formulario.get('estado')?.hasError('required')">

        El estado es obligatorio.

      </mat-error>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close>

    Cancelar

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="guardar()">

    {{ modoEdicion ? 'Actualizar' : 'Guardar' }}

  </button>

</mat-dialog-actions>
