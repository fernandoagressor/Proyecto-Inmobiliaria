<app-page-header
  titulo="Propiedades"
  subtitulo="Administración de propiedades"
>
</app-page-header>

<mat-card>

  <mat-card-content>

    <div class="contenedor-boton">

      <button
        mat-raised-button
        color="primary"
        (click)="abrirFormulario()">

        <mat-icon>add</mat-icon>

        Nueva Propiedad

      </button>

    </div>

    <table
      mat-table
      [dataSource]="propiedades"
      class="mat-elevation-z2">

      <!-- Código -->
      <ng-container matColumnDef="codigo">

        <th mat-header-cell *matHeaderCellDef>
          Código
        </th>

        <td mat-cell *matCellDef="let propiedad">
          {{ propiedad.codigo }}
        </td>

      </ng-container>

      <!-- Título -->
      <ng-container matColumnDef="titulo">

        <th mat-header-cell *matHeaderCellDef>
          Título
        </th>

        <td mat-cell *matCellDef="let propiedad">
          {{ propiedad.titulo }}
        </td>

      </ng-container>

      <!-- Dirección -->
      <ng-container matColumnDef="direccion">

        <th mat-header-cell *matHeaderCellDef>
          Dirección
        </th>

        <td mat-cell *matCellDef="let propiedad">
          {{ propiedad.direccion }}
        </td>

      </ng-container>

      <!-- Valor -->
      <ng-container matColumnDef="valor">

        <th mat-header-cell *matHeaderCellDef>
          Valor
        </th>

        <td mat-cell *matCellDef="let propiedad">

          {{
          propiedad.valor
          | currency:'COP':'symbol':'1.0-0'
          }}

        </td>

      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">

        <th mat-header-cell *matHeaderCellDef>
          Estado
        </th>

        <td mat-cell *matCellDef="let propiedad">
          {{ propiedad.estado }}
        </td>

      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">

        <th mat-header-cell *matHeaderCellDef>
          Acciones
        </th>

        <td mat-cell *matCellDef="let propiedad">

          <button
            mat-icon-button
            color="primary"
            (click)="editarPropiedad(propiedad)">

            <mat-icon>edit</mat-icon>

          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="eliminarPropiedad(propiedad)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="columnasMostradas">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: columnasMostradas">
      </tr>

    </table>

  </mat-card-content>

</mat-card>
