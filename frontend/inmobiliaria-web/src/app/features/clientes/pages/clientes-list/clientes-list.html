<div class="clientes-container">

  <app-page-header
    titulo="Clientes"
    textoBoton="Nuevo Cliente"
    icono="add"
    (accion)="abrirFormulario()">
  </app-page-header>

  <mat-card>

    <mat-card-content>

      <table
        mat-table
        [dataSource]="clientes"
        class="tabla-clientes"
      >

        <ng-container matColumnDef="idCliente">

          <th mat-header-cell *matHeaderCellDef>
            ID
          </th>

          <td mat-cell *matCellDef="let cliente">
            {{ cliente.idCliente }}
          </td>

        </ng-container>

        <ng-container matColumnDef="nombreCompleto">

          <th mat-header-cell *matHeaderCellDef>
            Nombre completo
          </th>

          <td mat-cell *matCellDef="let cliente">
            {{ cliente.nombreCompleto }}
          </td>

        </ng-container>

        <ng-container matColumnDef="telefono">

          <th mat-header-cell *matHeaderCellDef>
            Teléfono
          </th>

          <td mat-cell *matCellDef="let cliente">
            {{ cliente.telefono }}
          </td>

        </ng-container>

        <ng-container matColumnDef="correo">

          <th mat-header-cell *matHeaderCellDef>
            Correo
          </th>

          <td mat-cell *matCellDef="let cliente">
            {{ cliente.correo }}
          </td>

        </ng-container>

        <ng-container matColumnDef="direccion">

          <th mat-header-cell *matHeaderCellDef>
            Dirección
          </th>

          <td mat-cell *matCellDef="let cliente">
            {{ cliente.direccion }}
          </td>

        </ng-container>

        <ng-container matColumnDef="acciones">

          <th mat-header-cell *matHeaderCellDef>
            Acciones
          </th>

          <td mat-cell *matCellDef="let cliente">



            <button
              mat-icon-button
              color="primary"
              (click)="editarCliente(cliente)"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              color="warn"
              (click)="eliminarCliente(cliente)"
            >
              <mat-icon>delete</mat-icon>
            </button>

          </td>

        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="columnasMostradas"
        ></tr>

        <tr
          mat-row
          *matRowDef="let fila; columns: columnasMostradas"
        ></tr>

      </table>

      @if (clientes.length === 0) {
      <p class="sin-resultados">
        No hay clientes registrados.
      </p>
      }

    </mat-card-content>

  </mat-card>

</div>
