<app-page-header
  titulo="Contratos"
  subtitulo="Administración de contratos inmobiliarios">
</app-page-header>

<mat-card>

  <mat-card-content>

    <div class="contenedor-boton">

      <button
        mat-raised-button
        color="primary"
        (click)="abrirFormulario()">

        <mat-icon>add</mat-icon>

        Nuevo Contrato

      </button>

    </div>

    <table
      mat-table
      [dataSource]="contratos"
      class="mat-elevation-z2">

      <!-- Cliente -->
      <ng-container matColumnDef="cliente">

        <th mat-header-cell *matHeaderCellDef>
          Cliente
        </th>

        <td mat-cell *matCellDef="let contrato">
          {{ contrato.nombreCliente }}
        </td>

      </ng-container>

      <!-- Propiedad -->
      <ng-container matColumnDef="propiedad">

        <th mat-header-cell *matHeaderCellDef>
          Propiedad
        </th>

        <td mat-cell *matCellDef="let contrato">
          {{ contrato.codigoPropiedad }}
        </td>

      </ng-container>

      <!-- Valor total -->
      <ng-container matColumnDef="valorTotal">

        <th mat-header-cell *matHeaderCellDef>
          Valor total
        </th>

        <td mat-cell *matCellDef="let contrato">
          {{
          contrato.valorTotal
          | currency:'COP':'symbol':'1.0-0'
          }}
        </td>

      </ng-container>

      <!-- Cuota inicial -->
      <ng-container matColumnDef="cuotaInicial">

        <th mat-header-cell *matHeaderCellDef>
          Cuota inicial
        </th>

        <td mat-cell *matCellDef="let contrato">
          {{
          contrato.cuotaInicial
          | currency:'COP':'symbol':'1.0-0'
          }}
        </td>

      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">

        <th mat-header-cell *matHeaderCellDef>
          Estado
        </th>

        <td mat-cell *matCellDef="let contrato">
          {{ contrato.estado }}
        </td>

      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">

        <th mat-header-cell *matHeaderCellDef>
          Acciones
        </th>

        <td mat-cell *matCellDef="let contrato">

          <button
            mat-icon-button
            color="primary"
            (click)="editarContrato(contrato)">

            <mat-icon>edit</mat-icon>

          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="eliminarContrato(contrato)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="columnasMostradas">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: columnasMostradas">
      </tr>

    </table>

  </mat-card-content>

</mat-card>
