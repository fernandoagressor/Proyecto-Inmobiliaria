<h2 mat-dialog-title>
  {{ modoEdicion ? 'Editar Contrato' : 'Nuevo Contrato' }}
</h2>

<mat-dialog-content>

  <form
    [formGroup]="formulario"
    class="formulario">

    <!-- Cliente -->
    <mat-form-field appearance="outline">

      <mat-label>Cliente</mat-label>

      <mat-select formControlName="idCliente">

        <mat-option
          *ngFor="let cliente of clientes"
          [value]="cliente.idCliente">

          {{ cliente.nombreCompleto }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Propiedad -->
    <mat-form-field appearance="outline">

      <mat-label>Propiedad</mat-label>

      <mat-select formControlName="idPropiedad">

        <mat-option
          *ngFor="let propiedad of propiedades"
          [value]="propiedad.idPropiedad">

          {{ propiedad.codigo }} - {{ propiedad.titulo }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Valor Total -->
    <mat-form-field appearance="outline">

      <mat-label>Valor Total</mat-label>

      <input
        matInput
        type="number"
        formControlName="valorTotal">

    </mat-form-field>

    <!-- Cuota Inicial -->
    <mat-form-field appearance="outline">

      <mat-label>Cuota Inicial</mat-label>

      <input
        matInput
        type="number"
        formControlName="cuotaInicial">

    </mat-form-field>

    <!-- Número de Cuotas -->
    <mat-form-field appearance="outline">

      <mat-label>Número de Cuotas</mat-label>

      <input
        matInput
        type="number"
        formControlName="numeroCuotas">

    </mat-form-field>

    <!-- Fecha Inicio -->
    <mat-form-field appearance="outline">

      <mat-label>Fecha Inicio</mat-label>

      <input
        matInput
        type="date"
        formControlName="fechaInicio">

    </mat-form-field>

    <!-- Estado -->
    <mat-form-field appearance="outline">

      <mat-label>Estado</mat-label>

      <mat-select formControlName="estado">

        <mat-option value="VIGENTE">
          VIGENTE
        </mat-option>

        <mat-option value="FINALIZADO">
          FINALIZADO
        </mat-option>

        <mat-option value="CANCELADO">
          CANCELADO
        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close>

    Cancelar

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="guardar()">

    {{ modoEdicion ? 'Actualizar' : 'Guardar' }}

  </button>

</mat-dialog-actions>
